name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEON_AUTH_BASE_URL: ${{ secrets.NEON_AUTH_BASE_URL }}
      NEON_AUTH_COOKIE_SECRET: ${{ secrets.NEON_AUTH_COOKIE_SECRET }}
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
      PUBLIC_NEON_AUTH_BASE_URL: ${{ secrets.NEON_AUTH_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Write build-time env (Vite inlines DATABASE_URL + PUBLIC_ vars)
        run: |
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "NEON_AUTH_BASE_URL=$NEON_AUTH_BASE_URL"
            echo "PUBLIC_NEON_AUTH_BASE_URL=$PUBLIC_NEON_AUTH_BASE_URL"
            echo "NEON_AUTH_COOKIE_SECRET=$NEON_AUTH_COOKIE_SECRET"
          } > .env
      - name: Build (astro) + deploy
        run: |
          pnpm build
          pnpm dlx wrangler@latest deploy
      - name: Push runtime secrets to the Worker
        run: |
          for KEY in DATABASE_URL NEON_AUTH_BASE_URL NEON_AUTH_COOKIE_SECRET RAZORPAY_KEY_ID RAZORPAY_KEY_SECRET; do
            VAL="${!KEY}"
            if [ -n "$VAL" ]; then echo "$VAL" | pnpm dlx wrangler@latest secret put "$KEY"; fi
          done
